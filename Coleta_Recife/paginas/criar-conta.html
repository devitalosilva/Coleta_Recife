        <div class="barra-conta" data-barra-conta>
            <div class="barra-conta__conteudo">
                <a href="login.html">Entrar</a>

            </div>
        </div>

        <div class="menu">

                </ul>

            </nav>

        </div>
    </header>

    <main class="pagina-form">
        <div class="cartao-form">
            <h1>Criar conta</h1>
            <p class="subtitulo">Preencha os dados abaixo para se cadastrar.</p>

            <form id="form-cadastro" novalidate>

                <div class="mensagem" data-mensagem role="alert" hidden></div>

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" autocomplete="name" maxlength="120" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
                </div>

                <div class="campo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" autocomplete="tel-national" inputmode="tel" placeholder="(81) 91234-5678" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo__senha">
                        <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
                        <button type="button" data-alternar-senha aria-label="Mostrar senha">Mostrar</button>
                    </div>
                    <p class="dica">Mínimo de 8 caracteres.</p>
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar senha</label>
                    <div class="campo__senha">
                        <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>
                        <button type="button" data-alternar-senha aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="botao-form">Criar conta</button>

            </form>

            <p class="link-alternativo">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>

    <footer>

        <h3>

        </h3>

        </p>

    </footer>
